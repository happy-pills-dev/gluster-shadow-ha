# /etc/samba/smb.conf — gluster-shadow-ha template
# Replace all <PLACEHOLDER> values and adjust paths before use.
# node0: share path = /srv/shadow/data  (overlay, see shadow-layer-setup.service)
# node1: share path = /cluster-shared/data    (direct GlusterFS)

[global]
    workgroup = WORKGROUP
    server string = Cluster Node %h
    clustering = yes
    idmap config * : backend = tdb
    ctdbd socket = /var/run/ctdb/ctdbd.socket
    private dir = /var/lib/samba/private

    log file = /var/log/samba/log.%m
    max log size = 50
    log level = 1

    security = user
    passdb backend = tdbsam

[myshare]
    comment = Cluster Shared Storage
    path = /cluster-shared/data
    browseable = yes
    writable = yes
    create mask = 0664
    directory mask = 0775
    valid users = @sambausers
