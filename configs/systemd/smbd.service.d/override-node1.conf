# /etc/systemd/system/smbd.service.d/cluster-shared-required.conf (node1)
#
# Drop-in: make smbd refuse to start if the cluster mount isn't ready.
# Converts silent-fail-open (empty share) into loud-fail-closed (smbd won't start).
#
# Install: cp this file to /etc/systemd/system/smbd.service.d/cluster-shared-required.conf
#          systemctl daemon-reload

[Unit]
After=cluster-shared.mount
Wants=cluster-shared.mount
