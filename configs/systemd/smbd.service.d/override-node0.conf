# /etc/systemd/system/smbd.service.d/cluster-shared-required.conf (node0)
#
# Drop-in: make smbd refuse to start if the shadow overlay isn't ready.
# Converts silent-fail-open (empty share) into loud-fail-closed (smbd won't start).
#
# Install: cp this file to /etc/systemd/system/smbd.service.d/cluster-shared-required.conf
#          systemctl daemon-reload

[Unit]
Requires=shadow-layer-setup.service
After=shadow-layer-setup.service
