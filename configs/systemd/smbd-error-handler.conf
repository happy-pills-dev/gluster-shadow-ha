# =============================================================================
# smbd-error-handler.conf
# Drop-in for smbd.service — places a README_FIRST.txt in the share root
# if the underlying filesystem isn't ready when Samba starts.
#
# This means users who connect to the share when the cluster is degraded
# see a plain-English explanation instead of an empty folder or a confusing
# "network path not found" error.
#
# INSTALL (run on BOTH nodes):
#   sudo mkdir -p /etc/systemd/system/smbd.service.d/
#   sudo cp configs/systemd/smbd-error-handler.conf \
#            /etc/systemd/system/smbd.service.d/error-handler.conf
#   sudo systemctl daemon-reload
#
# CUSTOMISE:
#   SHARE_ROOT  — set to the directory Samba serves (check your smb.conf [path])
#   On node0 this is typically /srv/shadow/data  (the shadow overlay)
#   On node1 this is typically /cluster-shared/data  (direct GlusterFS mount)
# =============================================================================

[Service]

# ── Check mount health before Samba starts ───────────────────────────────────
# ExecStartPre runs as root, before the main smbd process.
# If it exits non-zero, smbd is NOT started and the error is logged.
#
# We check two things:
#   1. Is the share path a real mounted filesystem (not a bare directory)?
#   2. Can we write to it? (catches read-only or stale NFS-style mounts)
#
# If either check fails we write README_FIRST.txt so users see a human-readable
# message rather than an empty share. Samba is still allowed to start — it just
# serves the error file — so we always exit 0.

ExecStartPre=/bin/bash -c '\
  SHARE_ROOT="${SHARE_ROOT:-/srv/shadow/data}"; \
  README="$SHARE_ROOT/README_FIRST.txt"; \
  \
  # Ensure the share directory exists regardless of cluster state \
  mkdir -p "$SHARE_ROOT"; \
  \
  HEALTHY=true; \
  REASON=""; \
  \
  # Check 1: is this a real mount point? \
  if ! mountpoint -q "$(dirname "$SHARE_ROOT")" && \
     ! mountpoint -q "$SHARE_ROOT"; then \
    HEALTHY=false; \
    REASON="The shared filesystem is not mounted."; \
  fi; \
  \
  # Check 2: can we write? \
  if $HEALTHY && ! touch "$SHARE_ROOT/.smbd_probe" 2>/dev/null; then \
    HEALTHY=false; \
    REASON="The shared filesystem is mounted read-only or is not accessible."; \
  fi; \
  rm -f "$SHARE_ROOT/.smbd_probe"; \
  \
  if $HEALTHY; then \
    # Cluster is healthy — remove any leftover error file \
    rm -f "$README"; \
    echo "smbd-error-handler: share root OK ($SHARE_ROOT)"; \
  else \
    # Write a plain-English error README to the share root \
    cat > "$README" <<EOF\
⚠  STORAGE CLUSTER — DEGRADED STATE\
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\
\
This share is currently in a degraded state.\
${REASON}\
\
Your files are safe. No data has been lost.\
The cluster will automatically recover when the underlying\
filesystem comes back online.\
\
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\
WHAT YOU CAN DO\
\
  1. Wait — the watchdog checks every 60 seconds and will\
     attempt to remount automatically.\
\
  2. Check cluster status on the server:\
       sudo systemctl status cluster-shared.mount\
       sudo gluster volume status\
       sudo ctdb status\
\
  3. If the problem persists, check the docs:\
       https://github.com/happy-pills-dev/gluster-shadow-ha/blob/main/docs/gotchas.md\
\
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\
Generated: $(date)\
Hostname:  $(hostname)\
EOF\
    echo "smbd-error-handler: share degraded — wrote README_FIRST.txt ($REASON)"; \
  fi; \
  exit 0'

# ── Clean up error file when smbd stops cleanly ──────────────────────────────
# (Re-run the check on stop; if healthy, remove the README)
ExecStopPost=/bin/bash -c '\
  SHARE_ROOT="${SHARE_ROOT:-/srv/shadow/data}"; \
  rm -f "$SHARE_ROOT/README_FIRST.txt"'
